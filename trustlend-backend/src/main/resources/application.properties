spring.application.name=trustlend-backend
server.port=8080

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/Lendingplate_Main

spring.datasource.username=root
spring.datasource.password=Rohit45
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
jwt.secret=ChangeThisToAReallyLongRandomBase64EncodedSecretKeyForJwtSigning123456
jwt.expiration=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173

# ---- Scheduling ----
# Cron for the overdue-check job. Default: every day at 1 AM.
# For demoing in an interview, you can temporarily set this to "*/30 * * * * *" (every 30s).
trustlend.overdue-check-cron=0 0 1 * * *
